name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/gaming/index.html
          test -f out/404.html
          test -f out/.htaccess
          test -f out/mechablast/index.html
          test -f out/mechablast/privacy/index.html
          test -f out/mechablast/terms/index.html
          test -f out/mechablast/support/index.html
          test -f out/mechablast/press/index.html
          test -f out/mechablast/og.png
          for n in 1 2 3 4; do test -f "out/mechablast/shots/shot$n.png"; done
          # The legal pages must render their source, not an empty shell.
          grep -q "Privacy Policy" out/mechablast/privacy/index.html
          grep -q "End User License Agreement" out/mechablast/terms/index.html
          echo "Static export verified."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7
