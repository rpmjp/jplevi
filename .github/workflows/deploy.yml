name: deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./
          # Setting exclude replaces the action's defaults, so they are
          # respecified here. blog/** keeps the Laravel blog out of the sync
          # entirely: it is never in out/, and this states that intent rather
          # than relying on the sync state file to remember it.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            blog/**
            blog